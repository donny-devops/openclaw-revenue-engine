name: Revenue Engine - Poll
on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane slug to poll (blank = all)"
        required: false
        default: ""
      dry_run:
        description: "Validate poll runtime without calling Moltgate"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
permissions:
  contents: read
concurrency:
  group: revenue-engine-poll
  cancel-in-progress: false  # Do not kill in-flight inbox processing mid-poll
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Concurrency guard prevents overlap; allow full poll window
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            moltgate.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Poll Moltgate inbox
        env:
          MOLTGATE_API_KEY: ${{ secrets.MOLTGATE_API_KEY }}
          MOLTGATE_BASE_URL: ${{ secrets.MOLTGATE_BASE_URL }}
          MOLTGATE_PROFILE_HANDLE: ${{ secrets.MOLTGATE_PROFILE_HANDLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # PAT with `gist` + `public_repo` scopes — required for Gist publishing.
          # The default GITHUB_TOKEN does not have gist scope.
          # Create at github.com/settings/tokens and store as GH_PAT repo secret.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REVENUE_ENGINE_URL: ${{ secrets.REVENUE_ENGINE_URL }}
          LOG_LEVEL: INFO
          INPUT_LANE: ${{ inputs.lane || '' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          BASE_URL="${MOLTGATE_BASE_URL:-https://moltgate.com}"
          export MOLTGATE_BASE_URL="$BASE_URL"
          args=(--once --direct-api --poll-only)
          if [ -n "${INPUT_LANE:-}" ]; then
            args+=(--lane "$INPUT_LANE")
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          python main.py "${args[@]}"
