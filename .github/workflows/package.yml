name: Package

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish package to npm if NPM_TOKEN is configured"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: Optional npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.publish_npm == 'true'
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: |
          npm run lint
          npm run type-check
          npm test
          npm run build

      - name: Check npm token
        id: npm-token
        shell: bash
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-token.outputs.configured == 'true'
        run: npm publish --access public

      - name: Skip npm publish when token is missing
        if: steps.npm-token.outputs.configured != 'true'
        run: echo "NPM_TOKEN is not configured; skipping npm publish."
