name: Railway Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENV_ID: ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set as a repo secret. Nothing was deployed. Run: gh secret set RAILWAY_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi
          args=(up --ci -m "deploy ${GITHUB_SHA}")
          if [ -n "$RAILWAY_SERVICE_ID" ]; then
            args+=(--service "$RAILWAY_SERVICE_ID")
          fi
          if [ -n "$RAILWAY_ENV_ID" ]; then
            args+=(--environment "$RAILWAY_ENV_ID")
          fi
          railway "${args[@]}"

      - name: Verify deploy is healthy
        env:
          HEALTHCHECK_URL: ${{ secrets.RAILWAY_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::warning::RAILWAY_HEALTHCHECK_URL is not set — skipping post-deploy health verification. The deploy command succeeded, but nothing confirmed the app actually came up healthy. Set this secret to your production /health URL to close this gap."
            exit 0
          fi
          echo "Polling $HEALTHCHECK_URL for a healthy response..."
          for attempt in $(seq 1 10); do
            if status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTHCHECK_URL"); then
              if [ "$status" = "200" ]; then
                echo "Healthy (HTTP $status) after $attempt attempt(s)."
                exit 0
              fi
              echo "Attempt $attempt: HTTP $status, retrying..."
            else
              echo "Attempt $attempt: request failed, retrying..."
            fi
            sleep 6
          done
          echo "::error::Deploy finished but $HEALTHCHECK_URL never returned HTTP 200 after 10 attempts."
          exit 1
