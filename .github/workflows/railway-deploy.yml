name: Railway Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          args=(up --ci -m "deploy ${GITHUB_SHA}")
          if [ -n "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            args+=(--service "${{ secrets.RAILWAY_SERVICE_ID }}")
          fi
          if [ -n "${{ secrets.RAILWAY_ENV_ID }}" ]; then
            args+=(--environment "${{ secrets.RAILWAY_ENV_ID }}")
          fi
          railway "${args[@]}"
