name: Deploy

on:
  workflow_call:
    inputs:
      version:
        description: "Image version tag produced by the Docker workflow"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag to deploy (e.g. main, sha-abc1234, v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Show target image
        run: |
          echo "Image: ghcr.io/${{ github.repository }}:${{ inputs.version }}"
          echo "Ref:   ${{ github.ref }}"

