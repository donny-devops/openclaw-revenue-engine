openapi: 3.0.3
info:
  title: OpenClaw Revenue Engine
  version: 1.0.0
  description: Paid-lane classification, Stripe checkout, usage metering, and MCP tools.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
  /revenue/summary:
    get:
      summary: Lane catalog summary plus live earnings snapshot
      responses:
        "200":
          description: Summary payload
  /revenue/checkout:
    post:
      summary: Create a Stripe or simulated checkout session for a paid lane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, customer_email]
              properties:
                title:
                  type: string
                body:
                  type: string
                customer_email:
                  type: string
                  format: email
                lane:
                  type: string
                service:
                  type: string
      responses:
        "201":
          description: Checkout session created
        "400":
          description: Invalid payload
  /revenue/earnings:
    get:
      summary: Operator earnings snapshot
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Collected and pending revenue
        "401":
          description: Missing or invalid operator token
        "503":
          description: Operator authentication is not configured
  /revenue/agents:
    get:
      summary: List enabled OpenClaw agents exposed by the revenue engine
      responses:
        "200":
          description: Enabled agent catalog
  /revenue/payments:
    get:
      summary: List tracked payment records
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment ledger entries
        "401":
          description: Missing or invalid operator token
        "503":
          description: Operator authentication is not configured
  /revenue/payments/{id}:
    get:
      summary: Fetch a single payment record by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment record
        "401":
          description: Missing or invalid operator token
        "404":
          description: Payment not found
        "503":
          description: Operator authentication is not configured
  /revenue/payments/{id}/collect:
    post:
      summary: Collect a simulated payment by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment collected
        "401":
          description: Missing or invalid operator token
        "400":
          description: Invalid collection request
        "403":
          description: Collection disabled in production
        "404":
          description: Payment not found
        "503":
          description: Operator authentication is not configured
  /usage/events:
    post:
      summary: Record an idempotent usage event
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Event recorded
        "400":
          description: Invalid usage event payload
        "401":
          description: Missing or invalid operator token
        "503":
          description: Operator authentication is not configured
  /usage/summary:
    get:
      summary: Read usage totals, optionally filtered by tenant
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenant_id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Usage summary
        "401":
          description: Missing or invalid operator token
        "503":
          description: Operator authentication is not configured
  /mcp:
    post:
      summary: MCP JSON-RPC entrypoint
      security:
        - bearerAuth: []
      responses:
        "200":
          description: JSON-RPC result
        "400":
          description: Invalid JSON-RPC request or MCP tool error
        "401":
          description: Missing or invalid operator token
        "503":
          description: Operator authentication is not configured
  /mcp/tools:
    get:
      summary: List MCP tool metadata without invoking a tool
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tool catalog
        "401":
          description: Missing or invalid operator token
        "503":
          description: Operator authentication is not configured
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
