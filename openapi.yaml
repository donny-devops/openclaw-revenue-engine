openapi: 3.0.3
info:
  title: OpenClaw Revenue Engine
  version: 1.0.0
  description: Paid-lane classification, Stripe checkout, usage metering, and MCP tools.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
  /revenue/summary:
    get:
      summary: Lane catalog summary plus live earnings snapshot
      responses:
        "200":
          description: Summary payload
  /revenue/checkout:
    post:
      summary: Create a Stripe or simulated checkout session for a paid lane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, customer_email]
              properties:
                title:
                  type: string
                body:
                  type: string
                customer_email:
                  type: string
                  format: email
                lane:
                  type: string
                service:
                  type: string
      responses:
        "201":
          description: Checkout session created
        "400":
          description: Invalid payload
  /revenue/earnings:
    get:
      summary: Operator earnings snapshot
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Collected and pending revenue
  /revenue/payments:
    get:
      summary: List tracked payment records
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment ledger entries
  /revenue/payments/{id}:
    get:
      summary: Fetch a single payment record
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment record
        "404":
          description: Payment not found
  /revenue/payments/{id}/collect:
    post:
      summary: Mark a simulated payment as collected
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment updated
        "400":
          description: Invalid or non-simulated payment
        "403":
          description: Simulated collection is disabled
        "404":
          description: Payment not found
  /usage/events:
    post:
      summary: Record an idempotent usage event
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Event recorded
  /usage/summary:
    get:
      summary: Return the usage summary for all tenants or one tenant
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenant_id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Usage summary
  /mcp:
    post:
      summary: MCP JSON-RPC entrypoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/McpRequest"
                - type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/McpRequest"
      responses:
        "200":
          description: JSON-RPC result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/McpResponse"
                  - type: array
                    items:
                      $ref: "#/components/schemas/McpResponse"
        "400":
          description: Invalid JSON-RPC payload
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /mcp/tools:
    get:
      summary: List available MCP tools
      responses:
        "200":
          description: MCP tool discovery payload
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    McpRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: number
            - type: "null"
        method:
          type: string
        params:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: object
              additionalProperties: true
    McpResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: number
            - type: "null"
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
